<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Install-as-app extras. They only do anything when manifest.webmanifest, sw.js and icons/ are hosted next to this file. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#74c8f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fruit Chop">
<title>Backyard Fruit Chop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-screen canvas playfield. Score sticker top-left, small grown-ups gear top-right, cards centered.
   Light look only, on purpose (no dark theme). */
:root{
  --sky:#74c8f2;
  --sky-low:#d6f1fb;
  --grass:#6cc24a;
  --sun:#ffd447;
  --sun-deep:#ffb52e;
  --berry:#f0364b;
  --ink:#243b5e;
  --ink-soft:#5b6f8f;
  --paper:#fffdf5;
  --veil:rgba(255,253,245,.62);
  --font-display:'Lilita One',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-body:'Nunito',ui-rounded,'Avenir Next',system-ui,sans-serif;
  --gutter:16px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--sky-low);color:var(--ink);font-family:var(--font-body);font-size:18px;
  overflow:hidden;overscroll-behavior:none;
  /* Stop iPad text selection, callout bubbles and tap flashes while little fingers mash the screen */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#game{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

/* ---- Score sticker ---- */
.score{
  position:absolute;top:var(--gutter);left:max(var(--gutter),env(safe-area-inset-left,0px));
  display:inline-flex;align-items:center;gap:.2em;padding:.08em .5em .08em .3em;
  font-family:var(--font-display);font-size:clamp(38px,8vw,66px);line-height:1.1;font-variant-numeric:tabular-nums;
  background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:999px;box-shadow:0 6px 0 var(--ink);
  pointer-events:none; /* swipes pass straight through to the fruit */
}
.score canvas{width:.85em;height:.85em}
.score.bump{animation:bump .28s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}

/* ---- Grown-ups gear: needs a press-and-hold so a toddler can't open it by accident ---- */
.gear{
  position:absolute;top:var(--gutter);right:max(var(--gutter),env(safe-area-inset-right,0px));
  width:48px;height:48px;padding:0;border-radius:50%;overflow:hidden;
  background:var(--paper);color:var(--ink-soft);border:3px solid var(--ink-soft);opacity:.85;cursor:pointer;
  display:grid;place-items:center;touch-action:none;z-index:3; /* stays reachable on top of the start and All done cards */
}
.gear svg{position:relative;width:26px;height:26px}
.gear .fill{position:absolute;inset:0;border-radius:50%;background:var(--sun);transform:scale(0)}
.gear.holding .fill{transform:scale(1);transition:transform .7s linear}
.hint{
  position:absolute;top:calc(var(--gutter) + 56px);right:max(var(--gutter),env(safe-area-inset-right,0px));
  background:var(--ink);color:var(--paper);font-weight:800;font-size:15px;padding:6px 12px;border-radius:12px;pointer-events:none;z-index:3;
}

/* ---- Countdown pill, only shown when a time limit is set ---- */
.time{
  position:absolute;top:var(--gutter);right:calc(max(var(--gutter),env(safe-area-inset-right,0px)) + 58px);
  display:flex;align-items:center;height:48px;box-sizing:border-box;padding:0 14px;
  font-family:var(--font-display);font-size:clamp(20px,4.5vw,28px);line-height:1;font-variant-numeric:tabular-nums;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;pointer-events:none;
}
.time.low{background:var(--sun)} /* last 10 seconds */

/* ---- Big number that pops up every 10 fruit ---- */
.cheer{
  position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;
  font-family:var(--font-display);font-size:clamp(96px,28vw,230px);line-height:1;color:var(--sun);
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);
}
.cheer.show{animation:cheer 1.1s ease-out}
@keyframes cheer{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.25)}}

/* ---- Fruit names that pop up where a fruit was chopped ---- */
.words{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.word{
  position:absolute;white-space:nowrap;transform:translate(-50%,-50%);
  font-family:var(--font-display);font-size:clamp(32px,7vw,62px);line-height:1;
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);
  animation:word 1.5s ease-out forwards;
}
.word.big{font-size:clamp(56px,14vw,130px)}
@keyframes word{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  22%{transform:translate(-50%,-50%) scale(1)}
  70%{opacity:1;transform:translate(-50%,-75%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-125%) scale(1)}
}

/* ---- Start card and grown-ups menu ---- */
/* flex + margin:auto on the card keeps it centered but still scrollable on a short screen */
.overlay{position:absolute;inset:0;display:flex;overflow-y:auto;touch-action:pan-y;padding-inline:var(--gutter);padding-block:var(--gutter);background:var(--veil)}
.card{
  display:grid;gap:18px;justify-items:center;text-align:center;width:100%;max-width:440px;box-sizing:border-box;margin:auto;
  padding:clamp(22px,5vw,38px);background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);
}
.card h1,.card h2{margin:0;font-family:var(--font-display);font-weight:400;line-height:1;text-wrap:balance;color:var(--ink)}
.card h1{font-size:clamp(36px,9vw,58px)}
.card h1 em{font-style:normal;color:var(--berry)}
.card h2{font-size:34px}
.card p{margin:0;max-width:30ch;line-height:1.4;font-weight:600;color:var(--ink-soft)}
.btn{
  font-family:var(--font-display);font-size:22px;color:var(--ink);background:var(--paper);
  border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 20px;min-height:56px;cursor:pointer;
}
.btn.big{font-size:clamp(30px,7vw,40px);background:var(--sun);padding:12px 44px;min-height:72px;border-radius:999px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.gear:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.btn.sm{font-size:18px;min-height:48px;padding:6px 14px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn.long{font-size:clamp(22px,5.5vw,28px);padding:12px 28px}
.btn[aria-pressed="true"]{background:var(--sun)}
/* Hold-to-confirm button: the darker fill sweeps across while you hold */
.btn.hold{position:relative;overflow:hidden}
.btn.hold .fill{position:absolute;inset:0;background:var(--sun-deep);transform:scaleX(0);transform-origin:left center}
.btn.hold.holding .fill{transform:scaleX(1);transition:transform .7s linear}
.btn.hold .txt{position:relative}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.group{display:grid;gap:10px;justify-items:center;width:100%}
.label{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.note{font-size:14px}
.field{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800}
/* user-select:text matters: the page-wide user-select:none would stop iPad Safari from typing in this box */
.field input{width:5.5em;font:800 20px var(--font-body);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;text-align:center;-webkit-user-select:text;user-select:text}
.ver{font-size:13px;font-weight:600;color:var(--ink-soft);opacity:.8}

@media (prefers-reduced-motion:reduce){
  .score.bump,.cheer.show{animation:none}
  .cheer.show{opacity:1}
  .word{animation:none}
}
</style>
<style>
/* Standalone file only: keep clear of the iPad status bar / home indicator */
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div id="game">
  <canvas id="stage" role="img" aria-label="Fruit tossed up over a sunny backyard. Swipe or tap fruit to chop it."></canvas>
  <div class="words" id="words" aria-hidden="true"></div>

  <div class="score" id="scorePill"><canvas id="scoreIcon" width="72" height="72" aria-hidden="true"></canvas><span id="score">0</span></div>

  <button class="gear" id="gear" type="button" aria-label="Grown-ups menu. Press and hold to open.">
    <span class="fill"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="3.34 3.34"/>
      <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
    </svg>
  </button>
  <div class="hint" id="gearHint" hidden>Hold to open</div>
  <div class="time" id="timePill" aria-label="Time left" hidden></div>

  <div class="cheer" id="cheer" aria-hidden="true"></div>

  <div class="overlay" id="startOverlay">
    <div class="card">
      <h1>Backyard <em>Fruit</em> Chop</h1>
      <p>Swipe or tap the fruit, then chop the pieces again. Nothing ends the game early.</p>
      <p class="note" id="startLimit" hidden></p>
      <button class="btn big" id="playBtn" type="button">Play</button>
    </div>
  </div>

  <div class="overlay" id="doneOverlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
      <h1 id="doneTitle">All done!</h1>
      <p id="doneText"></p>
      <button class="btn big long hold" id="againBtn" type="button"><span class="fill"></span><span class="txt">Hold to play again</span></button>
    </div>
  </div>

  <div class="overlay" id="menuOverlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <h2 id="menuTitle">Grown-ups</h2>
      <div class="group">
        <div class="label" id="limitLabel">Play time</div>
        <div class="row" id="limitSeg" role="group" aria-labelledby="limitLabel">
          <button class="btn sm" type="button" data-limit="0">No limit</button>
          <button class="btn sm" type="button" data-limit="1">1 min</button>
          <button class="btn sm" type="button" data-limit="5">5 min</button>
          <button class="btn sm" type="button" data-limit="10">10 min</button>
          <button class="btn sm" type="button" data-limit="custom">Custom</button>
        </div>
        <div class="field" id="customRow" hidden>
          <label for="customMin">Minutes</label>
          <input id="customMin" type="number" inputmode="numeric" min="1" max="180" step="1" value="15">
        </div>
        <p class="note">Picking a time restarts the countdown. When it runs out the fruit stops, and a grown-up holds a button to play again.</p>
      </div>
      <div class="group">
        <div class="row">
          <button class="btn sm" id="soundBtn" type="button" aria-pressed="true">Sound is on</button>
          <button class="btn sm" id="resetBtn" type="button">Set score to 0</button>
          <button class="btn sm" id="fullBtn" type="button" hidden>Full screen</button>
          <button class="btn sm" id="installBtn" type="button">Install app</button>
        </div>
        <p class="note" id="installNote" hidden></p>
      </div>
      <button class="btn big" id="closeBtn" type="button">Back</button>
      <div class="ver" id="ver"></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* Version: CalVer + daily build number. Bump on every code change. Shown in the grown-ups menu. */
const VERSION = 'v2026.10.04.03';

/* ============================================================
   TUNING: the knobs worth touching if the game feels too fast
   or too slow for your kid. Everything is relative to screen
   height so it plays the same on an iPad and a big monitor.
   ============================================================ */
const TUNE = {
  gravity: 0.5,      // screen-heights per second². Lower = floatier, slower fruit
  apexMin: 0.55,     // lowest peak of a toss (fraction of screen height)
  apexMax: 0.82,     // highest peak of a toss
  spawnMin: 1.0,     // shortest wait between tosses (seconds)
  spawnMax: 1.7,     // longest wait between tosses
  maxFruit: 5,       // never more than this many whole fruit in the air
  sizeFrac: 0.095,   // fruit radius as a fraction of the shorter screen side
  hitPad: 1.2,       // hit area = fruit radius × this, so near misses still count
  cheerEvery: 25,    // little celebration every N chops
  maxCuts: 3,        // how many times one fruit can be sliced again (3 = up to 8 bits per fruit)
  recutDelay: 0.22,  // seconds before a fresh piece can be cut again, so one swipe = one cut
  messSeconds: 10,   // how long a juice stain takes to fade away
  messMax: 60,       // most stains kept at once; past this the oldest fade early (keeps old iPads smooth)
  rainbowMin: 6,     // a rainbow melon (the big harmless exploder) arrives every 6 to 10 tosses
  rainbowMax: 10     // set rainbowMax to 0 to switch the rainbow melon off
};

const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const game = $('game'), canvas = $('stage'), ctx = canvas.getContext('2d');
const scoreEl = $('score'), scorePill = $('scorePill'), cheerEl = $('cheer');
const bg = document.createElement('canvas');   // the backyard is painted once here, then stamped each frame

let W = 0, H = 0, dpr = 1;
let score = 0, paused = false, spawnTimer = 0.4;
// phase: 'attract' (start card showing) -> 'play' -> 'winddown' (time is up, last fruit still falling) -> 'done'
let phase = 'attract';
let limitSec = 0, timeLeft = 0, windT = 0, shownSec = -1;   // limitSec 0 means no time limit
const pieces = [];   // everything in the air: whole fruit and the bits they get chopped into
const splats = [];   // juice stains left on the scene, oldest first
const drops = [], stars = [], flashes = [], clouds = [];
let shake = 0;       // seconds of screen wobble left after a rainbow melon bursts
const trails = new Map();   // one swipe trail per finger (or the mouse), keyed by pointerId

/* ============================================================
   FRUIT ART
   Each fruit has: shape() = its outline path, skin() = the whole
   fruit, flesh() = the cut face shown on chopped pieces, and an
   optional top() for stems/leaves. All drawn around (0,0) with
   radius r so they can be rotated and scaled freely.
   ============================================================ */
const LINE = 'rgba(36,59,94,.5)';

function gloss(c, r) {            // the little white shine
  c.save(); c.translate(-r * 0.36, -r * 0.42); c.rotate(-0.6);
  c.beginPath(); c.ellipse(0, 0, r * 0.26, r * 0.13, 0, 0, TAU);
  c.fillStyle = 'rgba(255,255,255,.42)'; c.fill(); c.restore();
}
function fillShape(c, k, r, s, color) {   // fill the fruit outline, shrunk by s (for rind/flesh rings)
  c.save(); c.scale(s, s); k.shape(c, r); c.restore();
  c.fillStyle = color; c.fill();
}
function wedges(c, k, r, s, n, color) {   // citrus segment lines, clipped to the pulp
  c.save(); c.save(); c.scale(s, s); k.shape(c, r); c.restore(); c.clip();
  c.strokeStyle = color; c.lineWidth = r * 0.05; c.lineCap = 'round'; c.beginPath();
  for (let i = 0; i < n; i++) { const a = i * TAU / n + 0.3; c.moveTo(0, 0); c.lineTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 1.3); }
  c.stroke(); c.restore();
}
function dot(c, x, y, rad, color) { c.beginPath(); c.arc(x, y, rad, 0, TAU); c.fillStyle = color; c.fill(); }
function leaf(c, x, y, r, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.beginPath(); c.ellipse(0, 0, r * 0.3, r * 0.14, 0, 0, TAU);
  c.fillStyle = '#3fae4a'; c.fill(); c.lineWidth = r * 0.04; c.strokeStyle = LINE; c.stroke(); c.restore();
}
function stem(c, r, y0) {
  c.beginPath(); c.moveTo(0, y0); c.quadraticCurveTo(r * 0.02, y0 - r * 0.2, r * 0.12, y0 - r * 0.34);
  c.lineWidth = r * 0.1; c.lineCap = 'round'; c.strokeStyle = '#7a4a22'; c.stroke();
}

const FRUITS = [
  { // Watermelon: the big easy target
    name: 'Watermelon', word: '#5fd16f', size: 1.25, juice: '#ff5a6e',
    shape(c, r) { c.beginPath(); c.ellipse(0, 0, r * 1.05, r * 0.92, 0, 0, TAU); },
    skin(c, r) {
      fillShape(c, this, r, 1, '#35a84b');
      c.save(); this.shape(c, r); c.clip(); c.fillStyle = '#1f7f37';
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.ellipse(i * r * 0.44, 0, r * 0.1, r, 0, 0, TAU); c.fill(); }
      c.restore(); gloss(c, r);
    },
    flesh(c, r) {
      fillShape(c, this, r, 1, '#35a84b'); fillShape(c, this, r, 0.9, '#eaf7c4'); fillShape(c, this, r, 0.82, '#ff5a6e');
      for (let i = 0; i < 7; i++) {
        const a = i * TAU / 7 + 0.4;
        c.save(); c.translate(Math.cos(a) * r * 0.48, Math.sin(a) * r * 0.42); c.rotate(a + Math.PI / 2);
        c.beginPath(); c.ellipse(0, 0, r * 0.045, r * 0.08, 0, 0, TAU); c.fillStyle = '#3a2a25'; c.fill(); c.restore();
      }
    }
  },
  { // Orange
    name: 'Orange', word: '#ffa53d', size: 1.0, juice: '#ffa62b',
    shape(c, r) { c.beginPath(); c.arc(0, 0, r, 0, TAU); },
    skin(c, r) {
      fillShape(c, this, r, 1, '#ff9d2e');
      const p = [[.3, .2], [-.2, .45], [.55, -.2], [-.5, .1], [.1, -.5], [.05, .7], [-.6, -.35], [.6, .45], [-.1, -.05]];
      for (const [x, y] of p) dot(c, x * r, y * r, r * 0.03, 'rgba(214,110,0,.5)');
      gloss(c, r);
    },
    flesh(c, r) {
      fillShape(c, this, r, 1, '#ff9d2e'); fillShape(c, this, r, 0.9, '#fff1cf'); fillShape(c, this, r, 0.82, '#ffb84d');
      wedges(c, this, r, 0.82, 8, '#fff1cf'); dot(c, 0, 0, r * 0.08, '#fff1cf');
    },
    top(c, r) { dot(c, 0, -r * 0.92, r * 0.08, '#2f7f37'); leaf(c, r * 0.28, -r * 1.0, r, -0.5); }
  },
  { // Apple
    name: 'Apple', word: '#ff6b76', size: 1.0, juice: '#f6d776',
    shape(c, r) {
      c.beginPath(); c.moveTo(0, -0.72 * r);
      c.bezierCurveTo(0.35 * r, -1.1 * r, 1.1 * r, -0.75 * r, r, 0);
      c.bezierCurveTo(0.95 * r, 0.7 * r, 0.4 * r, 1.08 * r, 0, 0.9 * r);
      c.bezierCurveTo(-0.4 * r, 1.08 * r, -0.95 * r, 0.7 * r, -r, 0);
      c.bezierCurveTo(-1.1 * r, -0.75 * r, -0.35 * r, -1.1 * r, 0, -0.72 * r); c.closePath();
    },
    skin(c, r) { fillShape(c, this, r, 1, '#e63946'); gloss(c, r); },
    flesh(c, r) {
      fillShape(c, this, r, 1, '#e63946'); fillShape(c, this, r, 0.88, '#fff5d9');
      for (const s of [-1, 1]) {
        c.beginPath(); c.ellipse(s * r * 0.14, r * 0.02, r * 0.15, r * 0.27, s * 0.2, 0, TAU); c.fillStyle = '#f1dfa3'; c.fill();
        c.beginPath(); c.ellipse(s * r * 0.14, r * 0.06, r * 0.05, r * 0.1, s * 0.2, 0, TAU); c.fillStyle = '#6b3f1d'; c.fill();
      }
    },
    top(c, r) { stem(c, r, -0.72 * r); leaf(c, r * 0.36, -r * 1.02, r, -0.45); }
  },
  { // Lemon
    name: 'Lemon', word: '#ffe14d', size: 0.95, juice: '#ffe45c',
    shape(c, r) {
      c.beginPath(); c.moveTo(-1.15 * r, 0);
      c.bezierCurveTo(-0.9 * r, -1.02 * r, 0.9 * r, -1.02 * r, 1.15 * r, 0);
      c.bezierCurveTo(0.9 * r, 1.02 * r, -0.9 * r, 1.02 * r, -1.15 * r, 0); c.closePath();
    },
    skin(c, r) {
      fillShape(c, this, r, 1, '#ffd93b');
      const p = [[.3, .15], [-.25, .3], [.5, -.15], [-.55, -.05], [0, -.4], [.1, .5], [-.1, 0]];
      for (const [x, y] of p) dot(c, x * r, y * r, r * 0.028, 'rgba(214,160,0,.55)');
      gloss(c, r);
    },
    flesh(c, r) {
      fillShape(c, this, r, 1, '#ffd93b'); fillShape(c, this, r, 0.88, '#fffbe0'); fillShape(c, this, r, 0.78, '#fff07a');
      wedges(c, this, r, 0.78, 8, '#fffbe0'); dot(c, 0, 0, r * 0.07, '#fffbe0');
    }
  },
  { // Kiwi
    name: 'Kiwi', word: '#a9dc4a', size: 0.9, juice: '#9bd13b',
    shape(c, r) { c.beginPath(); c.ellipse(0, 0, r, r * 0.88, 0, 0, TAU); },
    skin(c, r) {
      fillShape(c, this, r, 1, '#8f6332');
      for (let i = 0; i < 26; i++) {   // fuzzy speckles, spread with the golden angle so they look random but never change
        const a = i * 2.399, d = r * 0.82 * Math.sqrt((i + 0.5) / 26);
        dot(c, Math.cos(a) * d, Math.sin(a) * d * 0.88, r * 0.022, 'rgba(255,235,200,.4)');
      }
      gloss(c, r);
    },
    flesh(c, r) {
      fillShape(c, this, r, 1, '#8f6332'); fillShape(c, this, r, 0.92, '#9bd13b');
      c.beginPath(); c.ellipse(0, 0, r * 0.24, r * 0.2, 0, 0, TAU); c.fillStyle = '#f3f6cf'; c.fill();
      for (let i = 0; i < 16; i++) { const a = i * TAU / 16; dot(c, Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.37, r * 0.035, '#2b2b2b'); }
    }
  },
  { // Strawberry
    name: 'Strawberry', word: '#ff7a8a', size: 0.95, juice: '#ff5c72',
    shape(c, r) {
      c.beginPath(); c.moveTo(0, 1.1 * r);
      c.bezierCurveTo(-0.5 * r, 0.9 * r, -1.1 * r, 0.1 * r, -0.9 * r, -0.5 * r);
      c.bezierCurveTo(-0.75 * r, -1.0 * r, 0.75 * r, -1.0 * r, 0.9 * r, -0.5 * r);
      c.bezierCurveTo(1.1 * r, 0.1 * r, 0.5 * r, 0.9 * r, 0, 1.1 * r); c.closePath();
    },
    skin(c, r) {
      fillShape(c, this, r, 1, '#f0364b');
      c.save(); this.shape(c, r); c.clip(); c.fillStyle = '#ffe27a';
      for (let row = 0; row < 5; row++) for (let col = -3; col <= 3; col++) {
        c.beginPath(); c.ellipse((col + (row % 2) * 0.5) * r * 0.36, (-0.4 + row * 0.32) * r, r * 0.035, r * 0.06, 0, 0, TAU); c.fill();
      }
      c.restore(); gloss(c, r);
    },
    flesh(c, r) {
      fillShape(c, this, r, 1, '#f0364b'); fillShape(c, this, r, 0.86, '#ff8492'); fillShape(c, this, r, 0.46, '#ffe0e4');
    },
    top(c, r) {
      c.fillStyle = '#3fae4a'; c.strokeStyle = LINE; c.lineWidth = r * 0.04;
      for (let i = -2; i <= 2; i++) {
        c.save(); c.translate(0, -0.9 * r); c.rotate(i * 0.55);
        c.beginPath(); c.ellipse(0, r * 0.22, r * 0.11, r * 0.26, 0, 0, TAU); c.fill(); c.stroke(); c.restore();
      }
    }
  },
  { // Plum
    name: 'Plum', word: '#cf9af5', size: 0.85, juice: '#b565d9',
    shape(c, r) { c.beginPath(); c.ellipse(0, 0, r * 0.98, r * 0.95, 0, 0, TAU); },
    skin(c, r) {
      fillShape(c, this, r, 1, '#7d43a8');
      c.beginPath(); c.moveTo(r * 0.05, -r * 0.88); c.quadraticCurveTo(r * 0.4, 0, r * 0.05, r * 0.88);
      c.lineWidth = r * 0.05; c.strokeStyle = 'rgba(60,20,90,.35)'; c.stroke(); gloss(c, r);
    },
    flesh(c, r) {
      fillShape(c, this, r, 1, '#7d43a8'); fillShape(c, this, r, 0.9, '#ffc94d');
      c.beginPath(); c.ellipse(0, 0, r * 0.26, r * 0.34, 0, 0, TAU); c.fillStyle = '#9a5a2c'; c.fill();
      c.beginPath(); c.ellipse(-r * 0.07, -r * 0.1, r * 0.06, r * 0.12, 0, 0, TAU); c.fillStyle = 'rgba(255,255,255,.25)'; c.fill();
    },
    top(c, r) { stem(c, r, -0.9 * r); }
  }
];

// The rainbow melon: a big, obviously special fruit that bursts into a screen-wide mess. It is not a bomb:
// nothing bad happens, it never ends the game, it is just the messiest thing to chop.
const RAINBOW = {
  size: 1.5, juice: '#ff5a6e', colors: ['#f0364b', '#ff9d2e', '#ffd93b', '#58c247', '#4aa8ff', '#a66bf0'],
  shape(c, r) { c.beginPath(); c.arc(0, 0, r, 0, TAU); },
  skin(c, r) {
    c.save(); this.shape(c, r); c.clip();
    const w = 2 * r / this.colors.length;
    this.colors.forEach((col, i) => { c.fillStyle = col; c.fillRect(-r + i * w - 1, -r, w + 2, 2 * r); });
    c.restore(); gloss(c, r);
  },
  flesh(c, r) { this.skin(c, r); },
  top(c, r) { stem(c, r, -0.96 * r); leaf(c, r * 0.36, -r * 1.24, r, -0.45); }
};

function outline(c, k, r) { k.shape(c, r); c.lineWidth = r * 0.07; c.strokeStyle = LINE; c.stroke(); }
function paintWhole(c, k, r) { k.skin(c, r); outline(c, k, r); if (k.top) k.top(c, r); }
function paintFlesh(c, k, r) { k.flesh(c, r); outline(c, k, r); }

/* ============================================================
   THE MESS
   Every chop leaves a juice stain that drips and then slowly
   fades (TUNE.messSeconds). Stain pictures are drawn once per
   colour and reused, so piling up dozens of them stays cheap.
   ============================================================ */
const spriteCache = new Map();
function blobPath(c, pts) {   // smooth lumpy outline through a ring of points
  const n = pts.length; c.beginPath();
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    if (!i) c.moveTo((pts[n - 1][0] + p[0]) / 2, (pts[n - 1][1] + p[1]) / 2);
    c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  c.closePath();
}
function splatSprite(color, variant) {
  const key = color + variant; let cv = spriteCache.get(key); if (cv) return cv;
  cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const c = cv.getContext('2d'), rnd = seeded(variant * 977 + 13), R = 80;
  c.translate(128, 128);
  const pts = [];
  for (let i = 0; i < 11; i++) { const a = i * TAU / 11, d = R * (0.6 + rnd() * 0.4); pts.push([Math.cos(a) * d, Math.sin(a) * d]); }
  c.fillStyle = color; blobPath(c, pts); c.fill();                       // lumpy middle
  c.strokeStyle = color; c.lineCap = 'round';
  for (let i = 0; i < 6; i++) {                                          // splash arms with a blob on the end
    const a = rnd() * TAU, d = R * (1.0 + rnd() * 0.3), w = R * (0.08 + rnd() * 0.08);
    c.lineWidth = w; c.beginPath(); c.moveTo(Math.cos(a) * R * 0.5, Math.sin(a) * R * 0.5); c.lineTo(Math.cos(a) * d, Math.sin(a) * d); c.stroke();
    dot(c, Math.cos(a) * d, Math.sin(a) * d, w * 0.9, color);
  }
  for (let i = 0; i < 9; i++) { const a = rnd() * TAU, d = R * (1.05 + rnd() * 0.38); dot(c, Math.cos(a) * d, Math.sin(a) * d, R * (0.04 + rnd() * 0.08), color); }   // flung droplets
  c.globalAlpha = 0.22; c.fillStyle = '#ffffff'; c.scale(0.55, 0.55); blobPath(c, pts); c.fill();                      // wet shine
  spriteCache.set(key, cv); return cv;
}
function addSplat(x, y, r, color, life) {
  const drips = [], nd = reduceMotion ? 0 : 1 + ((Math.random() * 3) | 0);
  for (let i = 0; i < nd; i++) drips.push({ dx: rand(-0.5, 0.5) * r, len: 0, max: r * rand(0.8, 2.4), w: r * rand(0.07, 0.13), v: r * rand(0.25, 0.6) });
  splats.push({ img: splatSprite(color, (Math.random() * 3) | 0), x, y, r, rot: rand(0, TAU), age: 0, life, color, drips, dead: false });
  for (let i = 0; i < splats.length - TUNE.messMax; i++) splats[i].life = Math.min(splats[i].life, splats[i].age + 0.5);
}

// App icon (strawberry on a splat). Used for the browser tab icon, and to make the PNG icon files for the installable version.
function makeIcon(size) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const c = cv.getContext('2d'), g = c.createLinearGradient(0, 0, 0, size);
  g.addColorStop(0, '#74c8f2'); g.addColorStop(1, '#c9ecfb'); c.fillStyle = g; c.fillRect(0, 0, size, size);
  c.drawImage(splatSprite('#ffe45c', 1), size * 0.04, size * 0.04, size * 0.92, size * 0.92);
  c.translate(size / 2, size * 0.53); c.rotate(-0.25); paintWhole(c, FRUITS[5], size * 0.25);
  return cv;
}
window.fruitChopIcon = size => makeIcon(size).toDataURL('image/png');

/* ============================================================
   BACKYARD BACKDROP
   Painted once per resize into an offscreen canvas (sky, hill,
   tree, fence, lawn, flowers). Only the sun rays and clouds are
   redrawn live, which keeps every frame cheap on older iPads.
   ============================================================ */
function seeded(a) {   // tiny repeatable random so the yard looks the same after a resize
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function sunSpot() { return { x: W * 0.74, y: H * 0.2, r: Math.min(W, H) * 0.085 }; }

function paintBackdrop() {
  bg.width = Math.round(W * dpr); bg.height = Math.round(H * dpr);
  const c = bg.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rnd = seeded(7), m = Math.min(W, H);

  // Sky, warming toward the horizon
  let g = c.createLinearGradient(0, 0, 0, H * 0.8);
  g.addColorStop(0, '#74c8f2'); g.addColorStop(0.6, '#bfe8fa'); g.addColorStop(1, '#fdf3cf');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // Soft glow behind the sun
  const s = sunSpot();
  g = c.createRadialGradient(s.x, s.y, s.r * 0.5, s.x, s.y, s.r * 3.4);
  g.addColorStop(0, 'rgba(255,236,150,.8)'); g.addColorStop(1, 'rgba(255,236,150,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // Far hill
  c.fillStyle = '#a9e27c'; c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) c.lineTo(x, H * 0.74 + Math.sin(x / W * TAU * 1.1 + 0.6) * H * 0.035);
  c.lineTo(W, H); c.closePath(); c.fill();

  // Fruit tree on the left
  const tx = W * 0.09, cr = m * 0.17, cy = H * 0.44;
  c.fillStyle = '#9b6b43'; c.fillRect(tx - Math.max(9, m * 0.016), cy, Math.max(18, m * 0.032), H * 0.45);
  for (const [ox, oy, col] of [[-.7, .15, '#4aa846'], [.7, .2, '#4aa846'], [0, -.45, '#57b84f'], [-.25, .3, '#57b84f'], [.3, -.05, '#66c75b'], [-.35, -.2, '#66c75b']])
    dot(c, tx + ox * cr, cy + oy * cr, cr * 0.72, col);
  for (const [ox, oy] of [[-.6, .1], [.2, -.5], [.75, .25], [-.1, .35], [.35, 0]]) dot(c, tx + ox * cr, cy + oy * cr, cr * 0.09, '#f0364b');

  // Picket fence
  const top = H * 0.72, bot = H * 0.9, pw = clamp(W / 26, 20, 44), gap = 5;
  c.fillStyle = '#f0dcae'; c.fillRect(0, top + (bot - top) * 0.22, W, (bot - top) * 0.1); c.fillRect(0, top + (bot - top) * 0.62, W, (bot - top) * 0.1);
  c.fillStyle = '#fff4dc'; c.strokeStyle = '#e3cb98'; c.lineWidth = 2;
  for (let x = -pw * 0.3; x < W; x += pw + gap) {
    c.beginPath(); c.moveTo(x, bot); c.lineTo(x, top + pw * 0.45); c.lineTo(x + pw / 2, top); c.lineTo(x + pw, top + pw * 0.45); c.lineTo(x + pw, bot); c.closePath();
    c.fill(); c.stroke();
  }

  // Front lawn
  g = c.createLinearGradient(0, H * 0.85, 0, H); g.addColorStop(0, '#7ad053'); g.addColorStop(1, '#58b641');
  c.fillStyle = g; c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) c.lineTo(x, H * 0.87 + Math.sin(x / W * TAU * 0.8 + 2) * H * 0.012);
  c.lineTo(W, H); c.closePath(); c.fill();

  // Grass tufts and a few flowers
  c.strokeStyle = 'rgba(40,120,45,.5)'; c.lineWidth = 2; c.lineCap = 'round';
  for (let i = 0; i < 28; i++) {
    const x = rnd() * W, y = H * (0.9 + rnd() * 0.09), t = 5 + rnd() * 5;
    c.beginPath(); c.moveTo(x - t, y - t); c.lineTo(x, y); c.lineTo(x + t, y - t); c.stroke();
  }
  const petals = ['#ffffff', '#ffd1dc', '#fff0a6'];
  for (let i = 0; i < 9; i++) {
    const x = rnd() * W, y = H * (0.91 + rnd() * 0.07), pr = 4 + rnd() * 3, col = petals[i % 3];
    for (let p = 0; p < 5; p++) dot(c, x + Math.cos(p * TAU / 5) * pr, y + Math.sin(p * TAU / 5) * pr, pr * 0.8, col);
    dot(c, x, y, pr * 0.7, '#ffb52e');
  }
}

function seedClouds() {
  clouds.length = 0;
  const m = Math.min(W, H);
  for (let i = 0; i < 4; i++) clouds.push({ x: rand(0, W), y: H * rand(0.07, 0.4), s: m * rand(0.07, 0.12), v: rand(5, 12) * (reduceMotion ? 0 : 1) });
}

function resize() {
  const box = game.getBoundingClientRect();
  W = Math.max(200, box.width); H = Math.max(200, box.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);   // cap at 2x: sharper than that just costs battery
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  paintBackdrop(); seedClouds();
}

/* ============================================================
   SOUND
   Everything is synthesized with Web Audio, so there are no
   sound files to ship. Browsers (iPad especially) only allow
   audio after a real tap, which is one reason for the Play button.
   ============================================================ */
let ac = null, master = null, noiseBuf = null, soundOn = true;
try { soundOn = localStorage.getItem('fruitchop.sound') !== 'off'; } catch (e) {}

function ensureAudio() {
  if (!soundOn) return;
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
const canPlay = () => soundOn && ac && ac.state === 'running';

function tone(freq, t0, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
}
// Each chop = a quick swoosh plus one note of a pentatonic scale, so mashing fruit always sounds tuneful
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
function playChop() {
  if (!canPlay()) return;
  try {
    const t0 = ac.currentTime;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(2600, t0); f.frequency.exponentialRampToValueAtTime(500, t0 + 0.14);
    g.gain.setValueAtTime(0.3, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    src.connect(f); f.connect(g); g.connect(master); src.start(t0); src.stop(t0 + 0.18);
    tone(NOTES[score % NOTES.length], t0, 0.28, 'triangle', 0.32);
  } catch (e) {}
}
function playCheer() {
  if (!canPlay()) return;
  try { const t0 = ac.currentTime + 0.05; [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => tone(n, t0 + i * 0.09, 0.3, 'triangle', 0.3)); } catch (e) {}
}
function playSplat() {   // rainbow melon: a soft low "bloop", a wet whoosh, then a quick happy run of notes (deliberately not a scary bang)
  if (!canPlay()) return;
  try {
    const t0 = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(220, t0); o.frequency.exponentialRampToValueAtTime(60, t0 + 0.3);
    g.gain.setValueAtTime(0.5, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.36);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.4);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), ng = ac.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = 'lowpass';
    f.frequency.setValueAtTime(1400, t0); f.frequency.exponentialRampToValueAtTime(200, t0 + 0.45);
    ng.gain.setValueAtTime(0.4, t0); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    src.connect(f); f.connect(ng); ng.connect(master); src.start(t0); src.stop(t0 + 0.52);
    NOTES.forEach((n, i) => tone(n, t0 + 0.1 + i * 0.06, 0.22, 'triangle', 0.22));
  } catch (e) {}
}

/* ============================================================
   GAME RULES
   Fruit is tossed up from below the screen, hangs, and falls.
   Missing fruit costs nothing. The score only ever goes up.
   Everything in the air is a "piece". A whole fruit is a piece
   with no cuts; every chop splits a piece into two smaller ones,
   up to TUNE.maxCuts deep, so one fruit can end up as 8 bits.
   ============================================================ */
const baseR = () => clamp(Math.min(W, H) * TUNE.sizeFrac, 36, 92);
const wholeCount = () => pieces.reduce((n, p) => n + (p.depth === 0 ? 1 : 0), 0);
const wordLayer = $('words');
let tossCount = 0, nextRainbow = 4;   // the first rainbow melon comes early so he finds it quickly

function toss(wait, kind) {
  kind = kind || FRUITS[(Math.random() * FRUITS.length) | 0];
  const r = baseR() * kind.size, g = TUNE.gravity * H;
  const apex = H * rand(TUNE.apexMin, TUNE.apexMax) + r;   // how far it rises from just below the bottom edge
  const vy = -Math.sqrt(2 * g * apex), air = 2 * -vy / g;  // launch speed for that height, and total time in the air
  const x = W * rand(0.14, 0.86), landX = W * rand(0.22, 0.78);
  // x,y = where the piece is; cx,cy = where that point sits in the fruit's own drawing; pr = rough size, for hit testing
  pieces.push({ kind, r, pr: r, depth: 0, clips: [], cx: 0, cy: 0, age: 0, x, y: H + r, vx: (landX - x) / air, vy, rot: rand(0, TAU), vr: rand(-1.6, 1.6), wait, dead: false });
}
function tossWave() {
  const room = TUNE.maxFruit - wholeCount(); if (room <= 0) return;
  tossCount++;
  if (phase === 'play' && TUNE.rainbowMax > 0 && tossCount >= nextRainbow && !pieces.some(p => p.kind === RAINBOW)) {
    tossCount = 0; nextRainbow = Math.round(rand(TUNE.rainbowMin, TUNE.rainbowMax));
    toss(0, RAINBOW); return;
  }
  // One at a time to begin with, then little groups of up to three
  let n = score < 5 ? 1 : (Math.random() < 0.5 ? 1 : (Math.random() < 0.7 ? 2 : 3));
  n = Math.min(n, room);
  for (let i = 0; i < n; i++) toss(i * 0.22);
}

function setScore(v, quiet) {
  score = v; scoreEl.textContent = String(score);
  if (quiet) return;
  scorePill.classList.remove('bump'); void scorePill.offsetWidth; scorePill.classList.add('bump');
}

// Pops the fruit's name up where it was chopped, so the word and the picture go together
function showWord(text, x, y, color, big) {
  while (wordLayer.children.length >= 5) wordLayer.firstChild.remove();
  const el = document.createElement('div');
  el.className = big ? 'word big' : 'word'; el.textContent = text; el.style.color = color;
  wordLayer.appendChild(el);
  const half = el.offsetWidth / 2 + 10;   // keep long words like Watermelon fully on screen
  el.style.left = clamp(x, half, Math.max(half, W - half)) + 'px';
  el.style.top = clamp(y, 60, Math.max(60, H - 60)) + 'px';
  setTimeout(() => el.remove(), 1500);
}

function spray(x, y, r, n, colors, power) {   // flying juice droplets
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = H * rand(0.12, 0.5) * power;
    drops.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - H * 0.12, r: r * rand(0.06, 0.17), color: colors[i % colors.length], life: 0, max: rand(0.5, 0.85) * (power > 1 ? 1.5 : 1) });
  }
}

function chop(p, angle) {
  if (p.dead) return;
  p.dead = true;
  setScore(score + 1);
  if (p.kind === RAINBOW) explode(p); else split(p, angle);
  if (score % TUNE.cheerEvery === 0) celebrate();
}

function split(p, angle) {
  const first = p.depth === 0;
  playChop();
  if (first) showWord(p.kind.name, p.x, p.y - p.r * 1.3, p.kind.word);   // name only on the first cut, not every re-slice

  // Two smaller pieces, pushed apart from the cut line. Each remembers every cut made so far
  // ("clips") so it can be drawn as the right wedge, and can be cut again.
  const a = angle - p.rot;                               // cut direction in the fruit's own (spinning) frame
  const lx = -Math.sin(a), ly = Math.cos(a);             // direction across the cut, in that frame
  const wx = -Math.sin(angle), wy = Math.cos(angle);     // same direction on screen
  const off = p.pr * 0.42, push = H * (first ? 0.16 : 0.11);
  for (const side of [1, -1]) pieces.push({
    kind: p.kind, r: p.r, pr: p.pr * 0.72, depth: p.depth + 1, age: 0, wait: 0, dead: false,
    clips: p.clips.concat({ px: p.cx, py: p.cy, ang: Math.atan2(ly * side, lx * side) }),
    cx: p.cx + lx * side * off, cy: p.cy + ly * side * off,
    x: p.x + wx * side * off, y: p.y + wy * side * off,
    rot: p.rot, vr: p.vr + side * 2.4,
    vx: p.vx * 0.6 + wx * side * push,
    vy: p.vy * 0.5 + wy * side * push - H * (first ? 0.1 : 0.14)   // little hop so bits hang around long enough to cut again
  });

  // Mess: a stain where it was cut, a smaller one flung along the swipe, plus droplets and a white slash
  addSplat(p.x, p.y, p.pr * rand(1.0, 1.4), p.kind.juice, TUNE.messSeconds);
  if (first) { const d = p.r * rand(1.6, 2.8); addSplat(p.x + Math.cos(angle) * d, p.y + Math.sin(angle) * d, p.r * rand(0.35, 0.6), p.kind.juice, TUNE.messSeconds); }
  spray(p.x, p.y, p.pr, reduceMotion ? 4 : (first ? 11 : 6), [p.kind.juice], 1);
  flashes.push({ x: p.x, y: p.y, angle, r: p.pr, life: 0 });
}

// Rainbow melon: no pieces, just stains in every colour thrown across the whole screen
function explode(p) {
  playSplat();
  showWord('Splat!', p.x, p.y, '#ffd447', true);
  const m = Math.min(W, H), cols = RAINBOW.colors, long = TUNE.messSeconds * 1.5;
  addSplat(p.x, p.y, p.r * 2.4, cols[(Math.random() * cols.length) | 0], long);
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * TAU + rand(-0.3, 0.3), d = m * rand(0.14, 0.42);
    addSplat(clamp(p.x + Math.cos(a) * d, 0, W), clamp(p.y + Math.sin(a) * d, 0, H), p.r * rand(0.9, 1.7), cols[i % cols.length], long * rand(0.75, 1));
  }
  for (let i = 0; i < 12; i++) addSplat(rand(0, W), rand(0, H), p.r * rand(0.25, 0.6), cols[i % cols.length], TUNE.messSeconds);
  spray(p.x, p.y, p.r, reduceMotion ? 10 : 46, cols, 2.2);
  if (!reduceMotion) shake = 0.4;
}

function celebrate() {
  playCheer();
  cheerEl.textContent = String(score);
  cheerEl.classList.remove('show'); void cheerEl.offsetWidth; cheerEl.classList.add('show');
  if (reduceMotion) { setTimeout(() => cheerEl.classList.remove('show'), 1100); return; }
  starBurst();
}
function starBurst() {
  if (reduceMotion) return;
  const cols = ['#ffd447', '#f0364b', '#ffffff', '#7ad053', '#7d43a8', '#ff9d2e'];
  for (let i = 0; i < 28; i++) {
    const a = rand(-Math.PI, 0), sp = H * rand(0.3, 0.9);
    stars.push({ x: W / 2 + rand(-W * 0.2, W * 0.2), y: H * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: baseR() * rand(0.14, 0.3), rot: rand(0, TAU), vr: rand(-6, 6), color: cols[i % cols.length], life: 0 });
  }
}

/* ============================================================
   INPUT
   Pointer Events cover fingers and the mouse with one code path.
   - Touch: swipe across fruit, or just poke it.
   - Mouse: simply moving over fruit chops it, no click or drag
     needed, since holding a button down is hard for a toddler.
   Several fingers at once all work (each gets its own trail).
   ============================================================ */
const nowS = () => performance.now() / 1000;
function pos(e) { const b = canvas.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top, t: nowS() }; }

function segDist(px, py, ax, ay, bx, by) {   // distance from a point to a line segment
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function hit(a, b) {
  if (paused || (phase !== 'play' && phase !== 'winddown')) return;   // the last falling fruit can still be chopped
  const moved = Math.hypot(b.x - a.x, b.y - a.y) > 2;
  for (const p of pieces) {
    // Skip bits that are already as small as they get, and bits made a moment ago (so one swipe is one cut)
    if (p.dead || p.wait > 0 || p.depth >= TUNE.maxCuts || (p.depth && p.age < TUNE.recutDelay)) continue;
    if (segDist(p.x, p.y, a.x, a.y, b.x, b.y) <= p.pr * TUNE.hitPad + 8)
      chop(p, moved ? Math.atan2(b.y - a.y, b.x - a.x) : rand(-1.0, -0.3));
  }
}

canvas.addEventListener('pointerdown', e => {
  const p = pos(e); trails.set(e.pointerId, { pts: [p], ended: false }); hit(p, p);
});
canvas.addEventListener('pointermove', e => {
  let tr = trails.get(e.pointerId);
  if (!tr || tr.ended) {
    if (e.pointerType !== 'mouse') return;        // a finger has to be touching; the mouse always counts
    tr = { pts: [], ended: false }; trails.set(e.pointerId, tr);
  }
  const p = pos(e), last = tr.pts[tr.pts.length - 1];
  tr.pts.push(p);
  if (last) hit(last, p);
});
function endTrail(e) { const tr = trails.get(e.pointerId); if (tr) tr.ended = true; }
canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') endTrail(e); });
canvas.addEventListener('pointercancel', endTrail);
canvas.addEventListener('pointerleave', endTrail);

// Stop the page from scrolling, zooming or popping a menu while playing
game.addEventListener('touchstart', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
game.addEventListener('touchmove', e => { if (!e.target.closest('.card')) e.preventDefault(); }, { passive: false });   // cards may scroll on short screens
game.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
// Any finished tap or key press is a chance to wake the audio back up (iPad suspends it when you leave the page)
for (const ev of ['pointerup', 'touchend', 'keydown']) window.addEventListener(ev, ensureAudio, { passive: true });

/* ============================================================
   UPDATE + DRAW (runs every frame)
   ============================================================ */
function update(dt) {
  const g = TUNE.gravity * H;

  // Countdown, only when a time limit is set. At zero we stop tossing, let the fruit already
  // in the air finish (so nothing vanishes mid-swipe), then show the All done card.
  if (phase === 'play' && limitSec > 0) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; phase = 'winddown'; windT = 0; }
    showTime();
  }
  if (phase === 'winddown') { windT += dt; if (!wholeCount() || windT > 4) finish(); }

  if (phase === 'attract' || phase === 'play') {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { tossWave(); spawnTimer = rand(TUNE.spawnMin, TUNE.spawnMax); }
  }

  for (const p of pieces) {
    if (p.wait > 0) { p.wait -= dt; continue; }
    p.age += dt;
    p.vy += g * (p.depth ? 1.2 : 1) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.vy > 0 && p.y > H + p.r * 1.8) p.dead = true;   // fell back off the bottom: no penalty, just gone
  }
  for (const s of splats) {   // stains age, their drips run down, then they are removed once fully faded
    s.age += dt; if (s.age > s.life) s.dead = true;
    for (const d of s.drips) d.len = Math.min(d.max, d.len + d.v * dt);
  }
  for (const d of drops) { d.life += dt; d.vy += g * 1.5 * dt; d.x += d.vx * dt; d.y += d.vy * dt; if (d.life > d.max) d.dead = true; }
  for (const s of stars) { s.life += dt; s.vy += g * 1.2 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt; if (s.y > H + 60 || s.life > 3) s.dead = true; }
  for (const fl of flashes) { fl.life += dt; if (fl.life > 0.18) fl.dead = true; }
  for (const c of clouds) { c.x += c.v * dt; if (c.x - c.s * 2 > W) c.x = -c.s * 2; }
  if (shake > 0) shake -= dt;

  for (const list of [pieces, splats, drops, stars, flashes])
    for (let i = list.length - 1; i >= 0; i--) if (list[i].dead) list.splice(i, 1);
}

function starPath(c, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r * 0.45 : r; c.lineTo(Math.cos(a) * d, Math.sin(a) * d); }
  c.closePath();
}

function drawPiece(c, p, t) {
  c.save(); c.translate(p.x, p.y);
  if (p.kind === RAINBOW) {   // glow, orbiting sparkles and a wobble so it reads as "the special one"
    const g = c.createRadialGradient(0, 0, p.r * 0.8, 0, 0, p.r * 1.8);
    g.addColorStop(0, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, p.r * 1.8, 0, TAU); c.fill();
    for (let i = 0; i < 4; i++) {
      const a = (reduceMotion ? 0.4 : t * 2) + i * TAU / 4;
      c.save(); c.translate(Math.cos(a) * p.r * 1.4, Math.sin(a) * p.r * 1.4); c.rotate(a); starPath(c, p.r * 0.17);
      c.fillStyle = '#ffffff'; c.fill(); c.lineWidth = 2; c.strokeStyle = LINE; c.stroke(); c.restore();
    }
    const wob = reduceMotion ? 1 : 1 + Math.sin(t * 7) * 0.05;
    c.rotate(p.rot); c.scale(wob, wob); paintWhole(c, p.kind, p.r);
    c.restore(); return;
  }
  c.rotate(p.rot); c.translate(-p.cx, -p.cy);
  if (!p.depth) { paintWhole(c, p.kind, p.r); c.restore(); return; }

  // A cut piece: mask to the fruit outline, then to the kept side of every cut, and show the cut face
  const B = p.r * 3;
  p.kind.shape(c, p.r); c.clip();
  for (const cl of p.clips) {
    c.translate(cl.px, cl.py); c.rotate(cl.ang);
    c.beginPath(); c.rect(0, -B, B, 2 * B); c.clip();
    c.rotate(-cl.ang); c.translate(-cl.px, -cl.py);
  }
  paintFlesh(c, p.kind, p.r);
  c.strokeStyle = LINE; c.lineWidth = p.r * 0.09;   // dark edge along each cut so the slices read clearly
  for (const cl of p.clips) {
    c.translate(cl.px, cl.py); c.rotate(cl.ang);
    c.beginPath(); c.moveTo(0, -B); c.lineTo(0, B); c.stroke();
    c.rotate(-cl.ang); c.translate(-cl.px, -cl.py);
  }
  c.restore();
}

function draw(t) {
  const c = ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.drawImage(bg, 0, 0, W, H);
  if (shake > 0) { const k = shake / 0.4 * 12; c.translate(rand(-k, k), rand(-k, k)); }   // wobble everything but the backdrop

  // Sun with slowly turning rays
  const s = sunSpot();
  c.save(); c.translate(s.x, s.y); c.rotate(reduceMotion ? 0 : t * 0.12);
  c.fillStyle = 'rgba(255,212,71,.75)';
  for (let i = 0; i < 12; i++) { c.rotate(TAU / 12); c.beginPath(); c.moveTo(-s.r * 0.16, -s.r * 1.18); c.lineTo(0, -s.r * 1.62); c.lineTo(s.r * 0.16, -s.r * 1.18); c.closePath(); c.fill(); }
  c.restore();
  dot(c, s.x, s.y, s.r, '#ffd447'); c.lineWidth = Math.max(2, s.r * 0.07); c.strokeStyle = '#f2b422'; c.stroke();

  // Clouds
  c.fillStyle = 'rgba(255,255,255,.93)';
  for (const cl of clouds) {
    for (const [ox, oy, rr] of [[-.9, .1, .55], [-.3, -.25, .7], [.4, -.1, .62], [.95, .15, .48]]) { c.beginPath(); c.arc(cl.x + ox * cl.s, cl.y + oy * cl.s, rr * cl.s, 0, TAU); c.fill(); }
    c.beginPath(); c.ellipse(cl.x, cl.y + cl.s * 0.32, cl.s * 1.35, cl.s * 0.36, 0, 0, TAU); c.fill();
  }

  // The mess: stains sit behind the fruit, pop in, drip, then fade over the last part of their life
  c.lineCap = 'round';
  for (const sp of splats) {
    const fade = clamp((sp.life - sp.age) / (sp.life * 0.45), 0, 1), k = sp.r * 1.6 * Math.min(1, 0.55 + sp.age / 0.12 * 0.45);
    c.globalAlpha = 0.88 * fade; c.strokeStyle = sp.color;
    for (const d of sp.drips) { if (d.len < 1) continue; c.lineWidth = d.w; c.beginPath(); c.moveTo(sp.x + d.dx, sp.y); c.lineTo(sp.x + d.dx, sp.y + sp.r * 0.5 + d.len); c.stroke(); }
    c.save(); c.translate(sp.x, sp.y); c.rotate(sp.rot); c.drawImage(sp.img, -k, -k, 2 * k, 2 * k); c.restore();
  }
  c.globalAlpha = 1;

  // Fruit and fruit bits
  for (const p of pieces) if (p.wait <= 0) drawPiece(c, p, t);

  // Juice droplets
  for (const d of drops) { c.globalAlpha = clamp(1 - d.life / d.max, 0, 1); dot(c, d.x, d.y, d.r, d.color); }
  c.globalAlpha = 1;

  // Slash flashes
  c.lineCap = 'round';
  for (const fl of flashes) {
    const k = fl.life / 0.18, len = fl.r * 1.9;
    c.globalAlpha = 1 - k; c.strokeStyle = '#ffffff'; c.lineWidth = fl.r * 0.16 * (1 - k) + 1;
    c.beginPath(); c.moveTo(fl.x - Math.cos(fl.angle) * len, fl.y - Math.sin(fl.angle) * len); c.lineTo(fl.x + Math.cos(fl.angle) * len, fl.y + Math.sin(fl.angle) * len); c.stroke();
  }
  c.globalAlpha = 1;

  // Celebration stars
  for (const st of stars) {
    c.save(); c.translate(st.x, st.y); c.rotate(st.rot); starPath(c, st.r);
    c.fillStyle = st.color; c.fill(); c.lineWidth = 2; c.strokeStyle = LINE; c.stroke(); c.restore();
  }

  // Swipe trails: forget points older than a moment so the tail fades away
  const cut = nowS() - 0.17, wide = baseR() * 0.22;
  c.lineJoin = 'round';
  for (const [id, tr] of trails) {
    while (tr.pts.length && tr.pts[0].t < cut) tr.pts.shift();
    if (!tr.pts.length) { if (tr.ended) trails.delete(id); continue; }
    const p = tr.pts, n = p.length;
    for (const [col, extra] of [['rgba(255,212,71,.6)', 8], ['#ffffff', 0]]) {
      c.strokeStyle = col;
      for (let i = 1; i < n; i++) {
        c.lineWidth = 3 + (i / (n - 1 || 1)) * wide + extra;
        c.beginPath(); c.moveTo(p[i - 1].x, p[i - 1].y); c.lineTo(p[i].x, p[i].y); c.stroke();
      }
    }
  }
}

let lastT = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000;
  const dt = Math.min(0.034, Math.max(0, t - lastT)); lastT = t;   // clamp so a paused tab doesn't fling fruit on return
  if (!paused) update(dt);
  draw(t);
}

/* ============================================================
   BUTTONS: Play, and the hold-to-open grown-ups menu
   ============================================================ */
const startOverlay = $('startOverlay'), menuOverlay = $('menuOverlay'), gear = $('gear'), gearHint = $('gearHint');
const soundBtn = $('soundBtn'), fullBtn = $('fullBtn');

const doneOverlay = $('doneOverlay'), timePill = $('timePill'), limitSeg = $('limitSeg');
const customRow = $('customRow'), customInput = $('customMin'), startLimit = $('startLimit');

/* ---- Time limit ----
   Default is no limit. The choice is remembered on this device. limitMode is '0', '1', '5', '10' or 'custom'. */
let limitMode = '0', customMin = 15;
try {
  const s = JSON.parse(localStorage.getItem('fruitchop.limit') || 'null');
  if (s && ['0', '1', '5', '10', 'custom'].includes(s.mode)) limitMode = s.mode;
  if (s && Number.isFinite(s.custom)) customMin = clamp(Math.round(s.custom), 1, 180);
} catch (e) {}

function showTime() {   // countdown pill; only touches the page when the visible second changes
  const on = limitSec > 0 && (phase === 'play' || phase === 'winddown');
  if (timePill.hidden === on) timePill.hidden = !on;
  if (!on) { shownSec = -1; return; }
  const s = Math.ceil(timeLeft); if (s === shownSec) return; shownSec = s;
  timePill.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  timePill.classList.toggle('low', s <= 10);
}
function applyLimit(changed) {
  limitSec = (limitMode === 'custom' ? customMin : Number(limitMode)) * 60;
  for (const b of limitSeg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.limit === limitMode));
  customRow.hidden = limitMode !== 'custom';
  startLimit.hidden = limitSec === 0; startLimit.textContent = 'Play time: ' + limitSec / 60 + ' min';
  if (changed) {
    try { localStorage.setItem('fruitchop.limit', JSON.stringify({ mode: limitMode, custom: customMin })); } catch (e) {}
    if (phase === 'play' || phase === 'winddown') { phase = 'play'; timeLeft = limitSec; }   // a new choice restarts the countdown
  }
  shownSec = -1; showTime();
}
limitSeg.addEventListener('click', e => {
  const b = e.target.closest('button[data-limit]'); if (!b) return;
  limitMode = b.dataset.limit; applyLimit(true);
});
customInput.addEventListener('input', () => {
  const n = parseInt(customInput.value, 10);
  if (n >= 1) { customMin = clamp(n, 1, 180); applyLimit(true); }
});
customInput.addEventListener('change', () => { customInput.value = customMin; });   // snap odd entries back to 1-180

function beginRound(freshScore) {
  ensureAudio();
  if (freshScore) setScore(0, true);
  phase = 'play'; timeLeft = limitSec; pieces.length = 0; spawnTimer = 0.3; tossCount = 0; nextRainbow = 4;
  startOverlay.hidden = true; doneOverlay.hidden = true;
  shownSec = -1; showTime();
}
function finish() {   // time is up
  phase = 'done'; showTime(); trails.clear();
  $('doneText').textContent = 'You made ' + score + (score === 1 ? ' chop.' : ' chops.');
  doneOverlay.hidden = false;
  playCheer(); starBurst();
}

// Press-and-hold helper (0.7s) so a toddler's taps can't trigger grown-up buttons. Keyboard Enter/Space works straight away.
function holdButton(el, onDone, onTap) {
  let timer = 0;
  el.addEventListener('pointerdown', () => {
    el.classList.add('holding');
    timer = setTimeout(() => { timer = 0; el.classList.remove('holding'); onDone(); }, 700);
  });
  const cancel = () => { if (!timer) return; clearTimeout(timer); timer = 0; el.classList.remove('holding'); if (onTap) onTap(); };
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) el.addEventListener(ev, cancel);
  el.addEventListener('click', e => { if (e.detail === 0) onDone(); });
}

$('playBtn').addEventListener('click', () => beginRound(false));
holdButton($('againBtn'), () => beginRound(true));

function openMenu() { paused = true; menuOverlay.hidden = false; $('closeBtn').focus(); }
function closeMenu() { paused = false; menuOverlay.hidden = true; }
$('closeBtn').addEventListener('click', closeMenu);
$('resetBtn').addEventListener('click', () => setScore(0, true));

function showSound() { soundBtn.textContent = soundOn ? 'Sound is on' : 'Sound is off'; soundBtn.setAttribute('aria-pressed', String(soundOn)); }
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; showSound();
  try { localStorage.setItem('fruitchop.sound', soundOn ? 'on' : 'off'); } catch (e) {}
  if (soundOn) ensureAudio();
});

// Full screen is a bonus: offered only where the browser supports it, and failure is ignored
if (document.fullscreenEnabled && game.requestFullscreen) {
  fullBtn.hidden = false;
  fullBtn.addEventListener('click', () => {
    try { (document.fullscreenElement ? document.exitFullscreen() : game.requestFullscreen()).catch(() => {}); } catch (e) {}
  });
}

/* ---- Install as an app (PWA) ----
   Needs the game on a real https address (GitHub Pages is fine) with manifest.webmanifest, sw.js and the icons
   folder sitting next to it. sw.js is what makes it work offline. From a saved file, or inside Claude, none of
   that exists, so the button just explains. iPad/iPhone have no install pop-up at all: Apple only allows
   Share > Add to Home Screen, so there the button shows those steps. */
const hosted = (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname)) && window.self === window.top;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS claims to be a Mac
const isInstalled = () => navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const installNote = $('installNote');
const say = msg => { installNote.textContent = msg; installNote.hidden = false; };
let installEvent = null;   // Chrome/Edge/Android hand us this when the page is installable
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; });
window.addEventListener('appinstalled', () => { installEvent = null; say('Installed. Look for Fruit Chop on the home screen.'); });
if (hosted && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }

$('installBtn').addEventListener('click', async () => {
  if (isInstalled()) return say('Already installed. You are in the app now.');
  if (installEvent) { const ev = installEvent; installEvent = null; try { ev.prompt(); await ev.userChoice; } catch (e) {} return; }
  if (!hosted) return say('Install works once the game is on its own web address, like GitHub Pages. It cannot install from a saved file or from inside Claude.');
  if (isIOS) return say('On iPad or iPhone: tap the Share button in the browser, then Add to Home Screen.');
  say('This browser has not offered an install. In Chrome or Edge, look for Install in the address bar or the browser menu.');
});

// The gear needs a hold too. A quick tap only shows a hint.
let hintTimer = 0;
holdButton(gear, openMenu, () => {
  gearHint.hidden = false; clearTimeout(hintTimer); hintTimer = setTimeout(() => { gearHint.hidden = true; }, 1500);
});

/* ============================================================
   BOOT
   ============================================================ */
function start(saved) {
  $('ver').textContent = VERSION;
  showSound();
  const ic = $('scoreIcon').getContext('2d'); ic.translate(36, 37); paintWhole(ic, FRUITS[5], 25);   // strawberry next to the score
  resize();
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(game);
  customInput.value = customMin; applyLimit(false);
  if (window.self === window.top) {   // browser tab icon, drawn from the game's own art
    try { const l = document.createElement('link'); l.rel = 'icon'; l.href = makeIcon(64).toDataURL('image/png'); document.head.appendChild(l); } catch (e) {}
  }
  if (saved && typeof saved.score === 'number') {   // picking up where a live update left off
    setScore(saved.score, true);
    if (saved.started) beginRound(false);
  }
  requestAnimationFrame(frame);
}

// If the page is hosted somewhere that can hot-swap updates, keep the score across the swap. Harmless elsewhere.
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ score, started: phase !== 'attract' })); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
